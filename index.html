<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="styles.css">
    </head>
    <body class="page">
        <header class="site-header">
            <div class="aside-header">
                <div class="hamburger">
                    <img src="/assets/menu_icon.png" alt="hamburger-menu">
                </div>
                <div class="quick-find">
                    <img src="/assets/search_icon.png" alt="search_icon">    
                    <input type="text" id="quick-find" name="Quick Find" placeholder="Quick Find">
                </div>                
            </div>
            <div class="task-counter">
                <div class="check-icon">
                    <img src="/assets/check_icon.png" alt="check_icon">
                </div>
                <div class="counter">
                    <h3>30/5</h3>
                </div>
            </div>
        </header>

        <main class="site-main">
            <aside class="navbar">
                <h1>navbar</h1>

            </aside>
            <section class="main-content">
                <h1>main section</h1>
            </section>
        </main>
    </body>
</html>
